<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
    <div class="card shadow-lg border-0 rounded-4" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="display-6 text-primary mb-2">
                    <i class="bi bi-layers-fill"></i>
                </div>
                <h3 class="fw-bold">Kore Framework</h3>
                <p class="text-muted small">Entre com suas credenciais para acessar</p>
            </div>
            <form id="kore-login-form">
                <div class="mb-3">
                    <label class="form-label fw-medium" for="login-username">Usuário ou E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="text" class="form-control" id="login-username" placeholder="seu.usuario" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium" for="login-password">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold btn-do-login">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</div>
